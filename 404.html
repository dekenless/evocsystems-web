<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found - evoc systems</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">
                <img src="/images/evoc%20logo%20web.jpg" alt="evoc systems" />
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav class="site-nav" id="siteNav">
                <a href="/">home</a>
                <a href="/about.html">about us</a>
                <a href="/services.html">services</a>
                <a href="/industries.html">industries</a>
                <a href="/technologies.html">technologies</a>
                <a href="/contact.html" class="nav-cta">contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="container">
                <h1>Page not found</h1>
                <p>The page you were looking for does not exist or a problem occurred when fetching the page.</p>
            </div>
        </section>
        <section class="section">
            <div class="container" style="text-align:center">
                <a class="btn" href="/">back to home</a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <nav class="footer-nav">
                <a href="/">home</a>
                <a href="/about.html">about us</a>
                <a href="/services.html">services</a>
                <a href="/industries.html">industries</a>
                <a href="/technologies.html">technologies</a>
                <a href="/contact.html">contact</a>
            </nav>
            <p class="copyright">&copy; evoc systems inc. <span class="year"></span> — all rights reserved</p>
        </div>
    </footer>

    <script>
        (function () {
            var btn = document.getElementById('navToggle');
            var nav = document.getElementById('siteNav');
            btn.addEventListener('click', function () {
                var open = nav.classList.toggle('open');
                btn.setAttribute('aria-expanded', open);
            });
            document.querySelectorAll('.year').forEach(function (el) { el.textContent = new Date().getFullYear(); });
        })();
    </script>
</body>
</html>
